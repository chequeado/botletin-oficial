# .github/workflows/deploy-frontend.yml
name: "Deploy demo a GitHub Pages"

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'          # solo se dispara si cambia algo en el frontend
  workflow_dispatch:           # permite correrlo manualmente desde la UI de GH

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys simultáneos
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Activar mock data y buildear
        working-directory: frontend
        env:
          # Vite reemplaza esta variable en build time — ver api.js
          VITE_USE_MOCK: 'true'
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4